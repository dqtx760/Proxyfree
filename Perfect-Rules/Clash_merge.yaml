# ============================================================
# 阿尔忒弥斯实验室 · Clash 完美分流 3.0
#
# 面向 Clash Verge / Mihomo
# 支持 Fake-IP、TUN、IPv6 防泄漏及多场景规则分流。
#
# 使用：
# Clash Verge → 订阅 → 全局扩展覆写配置
# 将本文件完整粘贴后保存即可。
#
# Rule Provider 每 24 小时自动更新。
# ============================================================


# ============================================================
# 核心网络设置
# ============================================================

# 关闭 IPv6，避免 IPv4 / IPv6 出口不一致
ipv6: false


# ============================================================
# TUN
# ============================================================

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53


# ============================================================
# DNS
# ============================================================

dns:
  enable: true

  # DNS 服务监听
  listen: 0.0.0.0:1053

  # 禁止返回 IPv6 DNS 记录
  ipv6: false

  # Fake-IP
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # Fake-IP 黑名单
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'

  # DNS 上游
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 解析 DNS 服务器自身
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6

  # 代理节点域名解析
  proxy-server-nameserver:
    - https://doh.pub/dns-query


